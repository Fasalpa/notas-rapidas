      rel="stylesheet"

    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/pixil-frame-favicon.png"
    />
    <title>Notas Rápidas</title>
  </head>
  <body>
    <header>
      <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <div class="navbar-brand" id="title" href="#">
            <img
              src="./assets/pixil-frame-favicon.png"
              alt="Logo"
              width="50"
              height="50"
              class="d-inline-block align-text-top"
              id="logo"
            />
            <div class="container-fluid container-description">
              <h1>Notas Rápidas</h1>
              <p>De ideas temporales a realidad</p>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section>
        <form action="">
          <input
            type="text"
            name="title"
            id="input-title"
            placeholder="¿Cómo nombraremos esta nota?"
            required
          />
          <textarea
            name="contend"
            placeholder="¿Ya tienes la idea? ¡Vamos a escribirla!"
            id="textarea-description"
            required
          ></textarea>
          <div class="container-colors">
            <button class="btn-color" id="one"></button>
            <button class="btn-color" id="two"></button>
            <button class="btn-color" id="three"></button>
            <button class="btn-color" id="four"></button>
            <button class="btn-color" id="five"></button>
            <button class="btn-color" id="six"></button>
            <button class="btn-color" id="seven"></button>
          </div>

          <div class="mood-slider">
            <input type="range" id="mood" min="0" max="100" value="50" />
            <div class="container-mood-desciption">
              <span>Muy mal</span>
              <span>Increible</span>
            </div>
            <p>
              ¿Cómo te sientes en relación a lo que escribiste en tu nota?
              <span id="mood-value">Neutral</span>
            </p>
          </div>
          <div class="container-destruction-items">
            <label class="container-destruction">
              <input type="checkbox" name="self-destruction" id="destruction" />
              <p>Autodestruir nota?</p>
            </label>

            <input
              type="number"
              name="time"
              id="time-self-destruction"
              placeholder="Horas"
              disabled
            />
          </div>

          <div class="container-hourglass">
            <label class="container-check">
              <input type="checkbox" name="capsule" id="check-capsule" />
              <p>Cápsula del tiempo</p>
            </label>
            <input
              type="datetime"
              name="unlock-date"
              id="unlock-date"
              disabled
            />
          </div>

          <div class="container-save-note">
            <button type="submit" id="btn-save-note">Guardar nota</button>
          </div>
        </form>
      </section>

      <section>
        <div class="container-view-notes">
          <section class="container-filter">
            <button type="button" class="btn-filter btn-filter-all">
              Todas
            </button>
            <button type="button" class="btn-filter btn-filter-mood">
              Ánimo
            </button>
            <button type="button" class="btn-filter btn-filter-capsule">
              Cápsulas
            </button>
          </section>
          <div class="container-notes">
            <img src="./assets/notes.png" alt="clean notes icon" />
            <h4>Aún no tienes notas</h4>
            <p id="question">Escribimos la primer nota?</p>
            <p>Arriba encontrarás todo para agregar tu nota.</p>
          </div>
